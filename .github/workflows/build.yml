name: Build ROM via Crave

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Crave CLI
      run: |
        curl -s https://raw.githubusercontent.com/accupara/crave/main/get_crave.sh | bash
        sudo mv crave /usr/local/bin/

    - name: Create Crave Auth File
      run: |
        mkdir -p ~/.config/crave
        cat <<EOF > ~/.config/crave/crave.json
        {
          "username": "${{ secrets.CRAVE_USERNAME }}",
          "token": "${{ secrets.CRAVE_PASSWORD }}"
        }
        EOF

    - name: Run ROM Build on Crave
      run: |
        crave run -- "repo init -u https://github.com/LineageOS/android.git -b lineage-16.0 --git-lfs --depth=1 && \
        mkdir -p .repo/local_manifests && \
        curl -o .repo/local_manifests/gt58lte.xml https://raw.githubusercontent.com/${{ github.repository }}/main/.repo/local_manifests/gt58lte.xml && \
        repo sync -c -j8 --force-sync --no-clone-bundle --no-tags && \
        source build/envsetup.sh && \
        lunch lineage_gt58lte-userdebug && \
        mka bacon -j\$(nproc)"

    - name: Pull ZIP File from Crave
      run: |
        crave pull out/target/product/gt58lte/*.zip || true

    - name: Upload System ZIP to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0-${{ github.run_id }}"
        name: "iyad aziez os v1.0"
        files: "*.zip"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
